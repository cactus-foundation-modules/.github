# Reusable build gate for Cactus modules.
#
# A module release used to be tagged without anyone building it: `tsc` and `eslint`
# run inside the module repo see a folder of files with no core around them, and
# neither can see a server/client boundary violation - only a real Next build can.
# The first machine to build a new tag was therefore a customer's, and on
# 2026-08-30 one of them (unified-inbox v0.1.25, a hook imported into a file with
# no 'use client') failed on a live site and took its updates down with it.
#
# So: compose the candidate against a real core, with a real database, and build it
# the way an install would. Module repos call this from a three-line workflow of
# their own - see scripts/install-module-ci.mjs.
name: Module build gate

on:
  workflow_call:
    inputs:
      core-ref:
        description: >-
          Core tag to build against. Defaults to core's newest release, which is
          what installs actually run. Pin it to reproduce a specific failure.
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build against core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # The build runs migrations (core init, core-reconcile, then every module's
      # own numbered files). Giving it a real empty Postgres means the gate proves
      # the module's SQL applies to a fresh install too, and keeps the build off
      # the no-database path an install never takes.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: cactus
          POSTGRES_DB: cactus_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:cactus@localhost:5432/cactus_gate
      DIRECT_URL: postgresql://postgres:cactus@localhost:5432/cactus_gate
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Choose the core to build against
        id: core
        run: |
          ref='${{ inputs.core-ref }}'
          if [ -z "$ref" ]; then
            # Not releases/latest: every core release is published as a prerelease,
            # and that endpoint skips prereleases entirely.
            # Authenticated deliberately. Anonymous API calls share a per-IP budget
            # with every other runner, and a rollout that triggers thirty-odd gates
            # at once exhausts it - a 403 here reads as a broken gate when nothing
            # is wrong with the module at all.
            ref=$(curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/usersaynoso/cactus-foundation/releases?per_page=1' \
              | jq -r '.[0].tag_name')
          fi
          if [ -z "$ref" ] || [ "$ref" = 'null' ]; then
            echo "Could not resolve a core release to build against." >&2
            exit 1
          fi
          echo "Building against core $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out core
        uses: actions/checkout@v4
        with:
          repository: usersaynoso/cactus-foundation
          ref: ${{ steps.core.outputs.ref }}
          path: core

      # The gate's own tooling comes from core's DEFAULT BRANCH, not the release
      # being built against. A fix to the composer would otherwise reach no module
      # until the next core release, while the workflow calling it (pinned @main by
      # every module's caller) had already moved on.
      - name: Check out the gate's tooling
        uses: actions/checkout@v4
        with:
          repository: usersaynoso/cactus-foundation
          ref: main
          path: core-tooling
          sparse-checkout: scripts/ci

      # Kept with its git history: checkout-modules.mjs restores tracked files with
      # `git checkout HEAD -- .` when a module directory already exists, which is
      # what makes the CANDIDATE commit the thing that gets built rather than the
      # last released tag.
      - name: Check out the module under test
        uses: actions/checkout@v4
        with:
          path: module-src

      - name: Place the module where core expects it
        id: module
        run: |
          name=$(node -e "process.stdout.write(require('./module-src/cactus.module.json').name)")
          if [ -z "$name" ]; then
            echo "cactus.module.json has no name." >&2
            exit 1
          fi
          mkdir -p core/modules
          mv module-src "core/modules/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Module: $name"

      - name: Compose the registry for this build
        working-directory: core
        env:
          CANDIDATE_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          cp modules.json modules.json.core
          node ../core-tooling/scripts/ci/compose-module-registry.mjs "modules/${{ steps.module.outputs.name }}"
          cat modules.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json

      # `npm install`, not `npm ci`, and deliberately. Core's package-lock.json is
      # generated on macOS, so it does not record the linux-only optional deps that
      # sharp and unrs-resolver pull in (@emnapi/*), and `npm ci` refuses a lockfile
      # it considers out of sync. Vercel never hits this - it installs against a warm
      # cache rather than a strict clean install - so demanding `ci` here would fail
      # every gate run for a reason no module author can act on, and would say
      # nothing about the module under test. Everything the lock DOES pin is still
      # honoured; only the missing platform packages are resolved.
      - name: Install core dependencies
        working-directory: core
        run: npm install --no-audit --no-fund

      # The whole point. prebuild puts the module on disk, migrates the throwaway
      # database, regenerates the router/Puck/extension wiring, and runs the client
      # graph check; then Next builds the lot exactly as a deploy would.
      - name: Build
        working-directory: core
        run: npm run build

      # A build proves the module COMPILES against core. It proves nothing about
      # whether its SQL parses: a raw query is a string to tsc and to eslint, and
      # a build never executes one. uk-bookkeeping v0.2.29 shipped a subquery
      # aliased `both` - a reserved word in Postgres - past a green typecheck, a
      # green eslint, 4870 green tests and a green run of this very gate, and the
      # entries list on a live site could not be read at all.
      #
      # The tests that WOULD have caught it exist. They were gated on SSH access
      # to the OVH server, so they skipped silently everywhere else, including
      # here. There is a perfectly good throwaway Postgres sitting beside this
      # job already, so they run against that instead: CACTUS_TEST_DATABASE_URL
      # picks the direct backend in core's lib/backup/test-database.ts, and the
      # suites are none the wiser about which server they got.
      #
      # Generic on purpose - no module is named. A module with no *.live.test.ts
      # skips the step and says so, and any module that adds one is covered from
      # then on without this file changing.
      - name: Run the module's live tests, if it has any
        working-directory: core
        env:
          # The superuser and the `postgres` database, not the build's own
          # cactus_gate: these suites CREATE and DROP databases of their own, and
          # a connection cannot drop the database it is connected to.
          CACTUS_TEST_DATABASE_URL: postgresql://postgres:cactus@localhost:5432/postgres
          RUN_LEDGER_GUARDS: '1'
        run: |
          name='${{ steps.module.outputs.name }}'
          mapfile -t suites < <(find "modules/$name" -name '*.live.test.ts' | sort)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "No live tests in $name - nothing to run against the database."
            exit 0
          fi
          echo "Running ${#suites[@]} live suite(s) against the gate's Postgres:"
          printf '  %s\n' "${suites[@]}"
          # Generous timeout. These provision a database and apply every migration
          # before the first assertion, and the 5s vitest default fails them on
          # setup alone.
          npx vitest run "${suites[@]}" --testTimeout 120000
